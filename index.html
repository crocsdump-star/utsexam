    color:var(--text);
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(120deg,var(--pink),var(--purple));
    color:white;
    padding:28px 20px 22px;
    text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,0.15);
  }
  header h1{margin:0 0 6px;font-size:1.7rem;}
  header p{margin:0;opacity:0.95;font-size:1rem;}
  .tabs{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:18px auto 0;
    flex-wrap:wrap;
    padding:0 12px;
  }
  .tab-btn{
    padding:10px 22px;
    border-radius:30px;
    border:2px solid var(--pink);
    background:white;
    color:var(--pink-dark);
    font-weight:600;
    cursor:pointer;
    font-size:0.95rem;
    transition:0.2s;
  }
  .tab-btn.active{
    background:var(--pink);
    color:white;
  }
  .container{
    max-width:760px;
    margin:20px auto;
    padding:0 16px;
  }
  .scorebar{
    position:sticky;
    top:0;
    z-index:10;
    background:white;
    border-radius:14px;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
    padding:12px 18px;
    margin-bottom:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    font-weight:600;
  }
  .scorebar .score{color:var(--pink-dark);}
  .progress-outer{
    width:100%;
    background:#f0e6f0;
    border-radius:10px;
    height:10px;
    margin-top:8px;
    overflow:hidden;
  }
  .progress-inner{
    height:100%;
    background:linear-gradient(90deg,var(--pink),var(--purple));
    width:0%;
    transition:width 0.3s;
  }
  .actions{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin:18px 0 26px;
  }
  .action-btn{
    padding:11px 18px;
    border:none;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
    font-size:0.9rem;
    color:white;
    box-shadow:0 3px 8px rgba(0,0,0,0.15);
    transition:0.15s;
  }
  .action-btn:active{transform:scale(0.96);}
  .btn-retake{background:#5c9ee6;}
  .btn-shuffle{background:#9b6fd6;}
  .btn-generate{background:#ff8a5c;}
  .question-card{
    background:var(--card);
    border-radius:16px;
    padding:18px 20px;
    margin-bottom:16px;
    box-shadow:0 3px 10px rgba(0,0,0,0.06);
    border:1px solid #f3e3ee;
  }
  .q-number{
    font-size:0.78rem;
    font-weight:700;
    color:var(--purple);
    margin-bottom:4px;
    letter-spacing:0.5px;
  }
  .q-text{
    font-weight:600;
    margin-bottom:12px;
    font-size:1.02rem;
    line-height:1.4;
  }
  .option{
    display:block;
    width:100%;
    text-align:left;
    padding:11px 14px;
    margin-bottom:8px;
    border-radius:10px;
    border:2px solid #ecdff0;
    background:#fffafd;
    cursor:pointer;
    font-size:0.95rem;
    transition:0.15s;
    color:var(--text);
  }
  .option:hover{border-color:var(--pink);}
  .option.correct{
    background:#e7f9ee;
    border-color:var(--green);
    color:#1d7a3f;
    font-weight:600;
  }
  .option.wrong{
    background:#ffeaea;
    border-color:var(--red);
    color:#c0392b;
    font-weight:600;
  }
  .option.disabled{cursor:default;}
  .feedback{
    margin-top:10px;
    padding:10px 14px;
    border-radius:10px;
    font-size:0.92rem;
    font-weight:600;
    line-height:1.4;
  }
  .feedback.correct-msg{background:#e7f9ee;color:#1d7a3f;}
  .feedback.wrong-msg{background:#fff0e9;color:#a8541f;}
  .completion-banner{
    background:linear-gradient(120deg,var(--pink),var(--purple));
    color:white;
    border-radius:18px;
    padding:24px 20px;
    text-align:center;
    margin:20px 0;
    box-shadow:0 6px 18px rgba(0,0,0,0.18);
    display:none;
  }
  .completion-banner.show{display:block;}
  .completion-banner h2{margin:0 0 8px;font-size:1.4rem;}
  .completion-banner p{margin:0;font-size:1rem;opacity:0.95;}
  .exam-section{display:none;}
  .exam-section.active{display:block;}
  footer{
    text-align:center;
    color:#9a8a97;
    font-size:0.85rem;
    margin-top:30px;
  }
</style>
</head>

function buildQuestions(raw){
  return raw.map(r=>({q:r[0],o:r[1].slice(),c:r[2]}));
}

const scenarioPool = buildQuestions(rawScenarios);

function sampleScenarios(n){
  return shuffleArray(scenarioPool).slice(0,n).map(it=>shuffleQuestionOptions(it));
}

const originalData = {1: buildQuestions(rawExam1), 2: buildQuestions(rawExam2), 3: null};
let currentData = {1: buildQuestions(rawExam1), 2: buildQuestions(rawExam2), 3: null};
let answers = {1: Array(50).fill(null), 2: Array(50).fill(null), 3: Array(10).fill(null)};

function randomFrom(arr){return arr[Math.floor(Math.random()*arr.length)];}

/* ================= RENDER ================= */
function render(examNum){
  const container = document.getElementById('questions'+examNum);
  container.innerHTML = '';
  currentData[examNum].forEach((item,idx)=>{
    const card = document.createElement('div');
    card.className='question-card';
    const chosen = answers[examNum][idx];

    let optionsHtml = '';
    item.o.forEach((opt,oIdx)=>{
      let cls='option';
      if(chosen!==null){
        cls+=' disabled';
        if(oIdx===item.c) cls+=' correct';
        else if(oIdx===chosen) cls+=' wrong';
      }
      optionsHtml += `<div class="${cls}" onclick="selectAnswer(${examNum},${idx},${oIdx})">${String.fromCharCode(65+oIdx)}. ${opt}</div>`;
    });

    let feedbackHtml='';
    if(chosen!==null){
      if(chosen===item.c){
        feedbackHtml = `<div class="feedback correct-msg">${randomFrom(correctMsgs)}</div>`;
      } else {
        feedbackHtml = `<div class="feedback wrong-msg">${randomFrom(wrongMsgs)}<br>✅ Correct answer: ${item.o[item.c]}</div>`;
      }
    }

    card.innerHTML = `<div class="q-number">QUESTION ${idx+1} OF ${currentData[examNum].length}</div>
      <div class="q-text">${item.q}</div>
      ${optionsHtml}
      ${feedbackHtml}`;
    container.appendChild(card);
  });
  updateScore(examNum);
}

function selectAnswer(examNum, qIdx, optIdx){
  if(answers[examNum][qIdx]!==null) return;
  answers[examNum][qIdx] = optIdx;
  render(examNum);
  // scroll feedback into gentle view
}

function updateScore(examNum){
  const ans = answers[examNum];
  const data = currentData[examNum];
  const total = data.length;
  let score=0, answeredCount=0;
  ans.forEach((a,i)=>{
    if(a!==null){
      answeredCount++;
      if(a===data[i].c) score++;
    }
  });
  document.getElementById('score'+examNum).textContent = score;
  document.getElementById('answered'+examNum).textContent = answeredCount;
  document.getElementById('progress'+examNum).style.width = (answeredCount/total*100)+'%';

  const banner = document.getElementById('banner'+examNum);
  if(answeredCount===total){
    const pct = Math.round(score/total*100);
    let msg='';
    if(pct>=90) msg = `You scored ${score}/${total} (${pct}%)! Absolutely brilliant, Wiku — you're a genius! 💖🌟`;
    else if(pct>=75) msg = `You scored ${score}/${total} (${pct}%)! Great job, Wiku, you really know your stuff! 💕`;
    else if(pct>=50) msg = `You scored ${score}/${total} (${pct}%)! Good effort, love — a little more review and you'll ace it! 🌸`;
    else msg = `You scored ${score}/${total} (${pct}%)! Don't be discouraged, Wiku — every attempt makes you stronger. I believe in you! 💪💗`;
    document.getElementById('bannerText'+examNum).textContent = msg;
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}

/* ================= SHUFFLE HELPERS ================= */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function shuffleQuestionOptions(item){
  const pairs = item.o.map((opt,i)=>({opt, isCorrect:i===item.c}));
  const shuffled = shuffleArray(pairs);
  const newOptions = shuffled.map(p=>p.opt);
  const newCorrect = shuffled.findIndex(p=>p.isCorrect);
  return {q:item.q, o:newOptions, c:newCorrect};
}

  currentData[examNum] = originalData[examNum].map(it=>({q:it.q,o:it.o.slice(),c:it.c}));

function shuffleExam(examNum){
  currentData[examNum] = shuffleArray(originalData[examNum]).map(it=>({q:it.q,o:it.o.slice(),c:it.c}));
  answers[examNum] = Array(originalData[examNum].length).fill(null);
  render(examNum);
  window.scrollTo({top:0, behavior:'smooth'});
}

function generateNewExam(examNum){
  if(examNum===3){
    originalData[3] = sampleScenarios(10);
    currentData[3] = originalData[3].map(it=>({q:it.q,o:it.o.slice(),c:it.c}));
    answers[3] = Array(10).fill(null);
    render(3);
    window.scrollTo({top:0, behavior:'smooth'});
    return;
  }
  const shuffledQuestions = shuffleArray(originalData[examNum]);
  currentData[examNum] = shuffledQuestions.map(it=>shuffleQuestionOptions(it));
  answers[examNum] = Array(50).fill(null);
  render(examNum);
  window.scrollTo({top:0, behavior:'smooth'});
}

  document.querySelectorAll('.tab-btn').forEach((btn,i)=>{

  document.getElementById('exam2').classList.toggle('active', num===2);

}
